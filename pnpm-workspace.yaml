# Explicitly allow build (postinstall) scripts only for these trusted
# dependencies. pnpm 10+ blocks dependency build scripts by default as a
# supply-chain safeguard, which otherwise fails `pnpm install` in CI with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msw: true
  sharp: true
minimumReleaseAgeExclude:
  - tar@7.5.3 || 7.5.4 || 7.5.7 || 7.5.8 || 7.5.10 || 7.5.11 || 7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - js-yaml@4.1.1 || 4.1.2 || 4.3.0
  - minimatch@3.1.3 || 3.1.4 || 9.0.6 || 9.0.7
  - rollup@4.59.0
  - ajv@6.14.0
  - flatted@3.4.0 || 3.4.2
  - brace-expansion@1.1.13 || 1.1.16 || 1.1.17 || 2.0.3 || 2.1.2 || 2.1.3
  - picomatch@2.3.2
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - ws@8.20.1 || 8.21.0
  - '@babel/core@7.29.1'
  - sharp@0.35.0
overrides:
  '@babel/core@<=7.29.0': ^7.29.1
  ajv@<6.14.0: ^6.14.0
  brace-expansion@<1.1.13: ^1.1.13
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=2.0.0 <2.0.3: ^2.0.3
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  flatted@<3.4.0: ^3.4.0
  flatted@<=3.4.1: ^3.4.2
  js-yaml@>=4.0.0 <4.1.1: ^4.1.1
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <=4.1.1: ^4.1.2
  minimatch@<3.1.3: ^3.1.3
  minimatch@<3.1.4: ^3.1.4
  minimatch@>=9.0.0 <9.0.6: ^9.0.6
  minimatch@>=9.0.0 <9.0.7: ^9.0.7
  picomatch@<2.3.2: ^2.3.2
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  sharp@<0.35.0: ^0.35.0
  tar@<7.5.7: ^7.5.7
  tar@<7.5.8: ^7.5.8
  tar@<=7.5.10: ^7.5.11
  tar@<=7.5.15: ^7.5.16
  tar@<=7.5.16: ^7.5.17
  tar@<=7.5.17: ^7.5.18
  tar@<=7.5.18: ^7.5.19
  tar@<=7.5.2: ^7.5.3
  tar@<=7.5.20: ^7.5.21
  tar@<=7.5.3: ^7.5.4
  tar@<=7.5.9: ^7.5.10
  ws@>=8.0.0 <8.20.1: ^8.20.1
  ws@>=8.0.0 <8.21.0: ^8.21.0
